<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer un Compte</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-lg p-4">
                    <h2 class="card-title text-center mb-4">Créer un Compte</h2>
                    <form>
                        <div class="mb-3">
                            <label for="newUsername" class="form-label">Nom d'utilisateur</label>
                            <input type="text" class="form-control" id="newUsername" placeholder="Choisissez un nom d'utilisateur" required>
                        </div>
                        <div class="mb-3">
                            <label for="newPassword" class="form-label">Mot de passe</label>
                            <input type="password" class="form-control" id="newPassword" placeholder="Créez un mot de passe" required>
                        </div>
                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">Confirmer le mot de passe</label>
                            <input type="password" class="form-control" id="confirmPassword" placeholder="Confirmez votre mot de passe" required>
                        </div>
                        <div class="mb-3">
                            <label for="newAccessLevel" class="form-label">Niveau d'accès souhaité</label>
                            <select class="form-select" id="newAccessLevel" required>
                                <option selected disabled value="">Sélectionnez un niveau</option>
                                <option value="utilisateur">Utilisateur</option>
                                <option value="administrateur">Administrateur</option>
                                <option value="super-utilisateur">Super Utilisateur</option>
                            </select>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success">Créer le compte</button>
                        </div>
                        <p class="text-center mt-3">
                            Déjà un compte ? <a href="login.html">Se connecter</a>
                        </p>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
        // Simple validation JavaScript pour la confirmation du mot de passe (côté client)
        document.querySelector('form').addEventListener('submit', function(event) {
            const password = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                alert('Les mots de passe ne correspondent pas !');
                event.preventDefault(); // Empêche l'envoi du formulaire
            }
        });
    </script>
</body>
</html>
